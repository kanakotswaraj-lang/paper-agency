<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പേപ്പർ & മാഗസിൻ ഏജൻസി മാനേജ്മെന്റ്</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Clean Readable Malayalam Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Malayalam', sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            color: #212529;
            padding-bottom: 80px;
        }
        h2, h4, h5, label, th, td, .btn {
            font-weight: 600 !important;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            background: #ffffff;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .bottom-nav-item {
            text-align: center;
            color: #8c98a4;
            text-decoration: none;
            font-size: 13px;
            flex-grow: 1;
            cursor: pointer;
            transition: 0.3s;
        }
        .bottom-nav-item.active {
            color: #4e54c8;
            font-weight: 700;
        }
        .bottom-nav-icon {
            font-size: 22px;
            display: block;
            margin-bottom: 3px;
        }
        /* Colorful Gradients */
        .gradient-header {
            background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%);
            color: white;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(78, 84, 200, 0.3);
        }
        .card-cust { border-left: 5px solid #0dcaf0; }
        .card-sub { border-left: 5px solid #198754; }
        .card-deliv { border-left: 5px solid #ffc107; }
        .card-due { border-left: 5px solid #dc3545; }
    </style>
</head>
<body class="p-3">

    <div class="container">
        <!-- Tab Contents -->
        <div class="tab-content">

            <!-- 1. DASHBOARD TAB -->
            <div class="tab-pane fade show active" id="tab-dashboard">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h4 class="mb-0 fw-bold text-dark">📊 ഡാഷ്‌ബോർഡ്</h4>
                        <small class="text-muted">ഇന്നത്തെ പ്രവർത്തന ചുരുക്കം</small>
                    </div>
                </div>

                <!-- Top Status Card -->
                <div class="gradient-header text-center">
                    <h2 class="display-4 fw-bold mb-1" id="dashDeliveredCount">0</h2>
                    <p class="mb-0 text-light fs-5" id="dashDeliveredText">എല്ലാം പൂർത്തിയായി</p>
                </div>

                <!-- Grid Cards -->
                <div class="row g-3">
                    <div class="col-6">
                        <div class="card p-3 h-100 card-cust">
                            <div class="text-info mb-2 fs-3">👥</div>
                            <h3 class="fw-bold mb-1 text-dark" id="dashTotalCust">0</h3>
                            <small class="text-muted">സജീവ ഉപയോക്താക്കൾ</small>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card p-3 h-100 card-sub">
                            <div class="text-success mb-2 fs-3">📰</div>
                            <h3 class="fw-bold mb-1 text-dark" id="dashTotalPapers">0</h3>
                            <small class="text-muted">സജീവ സബ്സ്‌ക്രിപ്ഷനുകൾ</small>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card p-3 h-100 card-deliv">
                            <div class="text-warning mb-2 fs-3">🚚</div>
                            <h3 class="fw-bold mb-1 text-dark" id="dashActiveDeliveries">0</h3>
                            <small class="text-muted">ഇന്ന് ഡെലിവർ</small>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card p-3 h-100 card-due">
                            <div class="text-danger mb-2 fs-3">💰</div>
                            <h3 class="fw-bold mb-1 text-danger" id="dashTotalDue">₹0</h3>
                            <small class="text-muted">ആകെ കുടിശ്ശിക</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. CUSTOMERS / USERS TAB -->
            <div class="tab-pane fade" id="tab-customers">
                <h4 class="text-success mb-3">👥 ഉപയോക്താക്കൾ & മാനേജ്മെന്റ്</h4>
                
                <!-- Add Customer Card -->
                <div class="card p-4 mb-4">
                    <h5 class="text-success mb-3">✨ പുതിയ കസ്റ്റമറെ ചേർക്കുക</h5>
                    <form id="customerForm" class="row g-3" onsubmit="addCustomer(event)">
                        <div class="col-md-6">
                            <label class="form-label">കസ്റ്റമറുടെ പേര്</label>
                            <input type="text" class="form-control" id="custName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ഫോൺ നമ്പർ (
